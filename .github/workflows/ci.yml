name: CI

# Mirrors the local "green gate": syntax-check cards.js + the inline <script>,
# run the zero-dep deck validator, and confirm index.html still loads cards.js.
# Pure Node — no dependencies, no build. Runs only when GitHub Actions executes
# it (push/PR to main); adding this file does not trigger anything by itself.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: validate-cards-and-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check cards.js
        run: |
          node --check cards.js
          echo "OK: cards.js parses cleanly."

      - name: Syntax-check the inline <script> in index.html
        run: |
          open=$(grep -n '<script>' index.html | head -1 | cut -d: -f1)
          close=$(grep -n '</script>' index.html | tail -1 | cut -d: -f1)
          sed -n "$((open+1)),$((close-1))p" index.html | node --check -
          echo "OK: inline <script> parses cleanly (lines $open..$close)."

      - name: Syntax-check the pre-paint theme script in <head>
        run: |
          open=$(grep -n '<script id="theme-boot">' index.html | cut -d: -f1)
          if [ -z "$open" ]; then
            echo "ERROR: the theme-boot script is missing — light mode would flash on load."
            exit 1
          fi
          close=$(awk -v s="$open" 'NR>s && /<\/script>/ {print NR; exit}' index.html)
          sed -n "$((open+1)),$((close-1))p" index.html | node --check -
          echo "OK: theme-boot <script> parses cleanly (lines $open..$close)."

      - name: Theme contract (both themes defined, no-FOUC hook present)
        run: |
          grep -q ':root\[data-theme="light"\]' index.html \
            || { echo "ERROR: the light theme block is gone."; exit 1; }
          grep -q 'color-scheme: light' index.html \
            || { echo "ERROR: light theme lost its color-scheme (UA scrollbars would stay dark)."; exit 1; }
          grep -q 'id="theme-color-meta"' index.html \
            || { echo "ERROR: the theme-color meta lost its id — the browser chrome would desync."; exit 1; }
          echo "OK: light + dark themes present, theme-color hook intact."

      - name: Run the card-deck data validator
        run: node test/cards.test.js

      - name: HTML smoke-check (index.html still loads cards.js)
        run: |
          if ! grep -q 'src="cards.js"' index.html; then
            echo "ERROR: index.html no longer references cards.js"
            exit 1
          fi
          echo "OK: index.html references cards.js."
